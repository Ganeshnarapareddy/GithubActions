name: "sixth workflow"

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  APP_NAME: GitHubActionsLearning
  VERSION: v1.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Printing
        run: |
          echo "APP Name is ${{ env.APP_NAME }}"
          echo "Version is ${{ env.VERSION }}"
